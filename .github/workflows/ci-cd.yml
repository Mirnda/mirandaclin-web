name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Build & Test  (runs on every push / PR)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration=production

      - name: Run tests
        env:
          CI: 'true'
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Deploy to EC2  (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Extract branch name
        id: branch
        run: |
          BRANCH=$(git branch --show-current | tr '/' '-')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT


      - name: Instance Docker Action
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
      
      - name: Build and Save docker Image
        id: docker
        run: |
          DOCKER_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}
          DOCKER_FILE_NAME=$DOCKER_IMAGE_NAME.tar
          DOCKER_TAG_NAME=$DOCKER_IMAGE_NAME:${{ steps.branch.outputs.branch }}

          docker build -t $DOCKER_TAG_NAME .
          docker save -o $DOCKER_FILE_NAME $DOCKER_TAG_NAME

          echo "image_name=$DOCKER_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "docker_file_name=$DOCKER_FILE_NAME" >> $GITHUB_OUTPUT
          echo "docker_tag_name=$DOCKER_TAG_NAME" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check existing instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Branch,Values=${{ steps.branch.outputs.branch }}" \
                      "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[*].Instances[*].InstanceId" --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Start instance if stopped
        if: steps.ec2.outputs.instance_id != ''
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.ec2.outputs.instance_id }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids ${{ steps.ec2.outputs.instance_id }}
            aws ec2 wait instance-running --instance-ids ${{ steps.ec2.outputs.instance_id }}
          fi

      - name: Create EC2 instance
        if: steps.ec2.outputs.instance_id == ''
        id: create
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "${{ secrets.EC2_IMAGE_ID }}" \
            --instance-type "${{ secrets.EC2_INSTANCE_TYPE }}" \
            --key-name "${{ secrets.EC2_ACCESS_KEY_NAME }}" \
            --security-group-ids "${{ secrets.EC2_SG_ID }}" \
            --user-data file://userdata.sh \
            --tag-specifications \
            "ResourceType=instance,Tags=[ {Key=Name,Value=${{ secrets.APP_NAME }}-${{ steps.branch.outputs.branch }}}, {Key=Branch,Value=${{ steps.branch.outputs.branch }}}, {Key=ExpiresAt,Value=$(date -d "+3 hours" +%Y-%m-%dT%H:%M:%SZ)}, {Key=Environment,Value=${{ secrets.APP_ENV }}} ]" \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Wait for EC2
        if: steps.ec2.outputs.instance_id == ''
        run: aws ec2 wait instance-running --instance-ids ${{ steps.create.outputs.instance_id }}

      - name: Get public IP
        id: ip
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID="${{ steps.create.outputs.instance_id }}"
          fi

          DNS=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicDnsName' \
            --output text)
          IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "dns=$DNS" >> $GITHUB_OUTPUT
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ip.outputs.ip }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP_KEY }}
          source: ${{ steps.docker.outputs.docker_file_name }}
          target: "/home/${{ secrets.APP_USER }}/app/"

      - name: Configure and start service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ip.outputs.ip }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP_KEY }}
          script: |
            APP_DIR="/home/${{ secrets.APP_USER }}/app"

            DOCKER_FILE="$APP_DIR/${{ steps.docker.outputs.docker_file_name }}"
            docker load -i "$DOCKER_FILE"
            docker stop ${{ steps.docker.outputs.image_name }} 2>/dev/null || true
            docker rm   ${{ steps.docker.outputs.image_name }} 2>/dev/null || true

            docker run -d \
              --name ${{ steps.docker.outputs.image_name }} \
              --restart always \
              -p ${{ secrets.APP_PORT }}:${{ secrets.APP_PORT }} \
              -e APP_PORT=${{ secrets.APP_PORT }} \
              ${{ steps.docker.outputs.docker_tag_name }}

            docker image prune -f


            sudo mkdir -p /etc/nginx/conf.d/
            NGINX_CONFIG=/etc/nginx/conf.d/${{ secrets.APP_NAME }}.conf

            {
            echo "server {"
            echo "    listen 80;"
            echo "    server_name ${{ steps.ip.outputs.dns }};"
            echo "    location / {"
            echo "        proxy_pass http://localhost:${{ secrets.APP_PORT }};"
            echo "        proxy_http_version 1.1;"
            echo "        proxy_set_header Host \$host;"
            echo "        proxy_set_header X-Real-IP \$remote_addr;"
            echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;"
            echo "        proxy_set_header X-Forwarded-Proto \$scheme;"
            echo "    }"
            echo "}"
            } | sudo tee $NGINX_CONFIG > /dev/null

            sudo grep -q 'server_names_hash_bucket_size' /etc/nginx/nginx.conf \
                && echo "já configurado" || sudo sed -i '/http {/a\\tserver_names_hash_bucket_size 128;' /etc/nginx/nginx.conf

            sudo rm -f /etc/nginx/conf.d/default.conf.template
            sudo rm -f /etc/nginx/sites-enabled/default

            sudo nginx -t 
            sudo systemctl enable nginx 
            sudo systemctl restart nginx
            sudo systemctl reload nginx

            sudo systemctl daemon-reload
            sudo systemctl enable ${{ secrets.APP_NAME }}
            sudo systemctl restart ${{ secrets.APP_NAME }}


