<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Olá, {{ greeting }}</h1>
      <p class="page-subtitle">Bem-vindo ao painel da sua clínica</p>
    </div>
    <span class="role-badge">{{ role }}</span>
  </div>

  <div class="cards-grid">
    <a routerLink="/clinics" class="card">
      <div class="card-icon card-icon--green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">Clínicas</p>
        <p class="card-action">Gerenciar →</p>
      </div>
    </a>

    <a routerLink="/appointments" class="card">
      <div class="card-icon card-icon--blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">Agendamentos</p>
        <p class="card-action">Ver agenda →</p>
      </div>
    </a>

    <a routerLink="/consultations" class="card">
      <div class="card-icon card-icon--purple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">Consultas</p>
        <p class="card-action">Ver relatórios →</p>
      </div>
    </a>

    <a routerLink="/users" class="card">
      <div class="card-icon card-icon--orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">Usuários</p>
        <p class="card-action">Gerenciar equipe →</p>
      </div>
    </a>
  </div>

  <div class="quick-section">
    <h2 class="section-title">Ações rápidas</h2>
    <div class="quick-actions">
      <a routerLink="/appointments/new" class="quick-btn quick-btn--primary">+ Novo agendamento</a>
      <a routerLink="/consultations/new" class="quick-btn quick-btn--primary">+ Nova consulta</a>
      <a routerLink="/clinics/new" class="quick-btn">+ Nova clínica</a>
      <a routerLink="/users/new" class="quick-btn">+ Novo usuário</a>
      <a routerLink="/invites/new" class="quick-btn">+ Convidar membro</a>
    </div>
  </div>
</div>
