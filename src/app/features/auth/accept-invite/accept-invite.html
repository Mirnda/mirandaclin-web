<div class="verify-wrapper">
  <div class="verify-card">
    <div class="verify-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9 2 6.5 4 6.5 7c0 1.5.5 3 1 4.5C8.5 14 9 16 9 18c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2 0-2 .5-4 1.5-6.5.5-1.5 1-3 1-4.5C17.5 4 15 2 12 2z" fill="#0F6E56"/>
      </svg>
    </div>

    @if (!success) {
      <div class="card-header">
        <h1 class="form-title">Aceitar convite</h1>
        <p class="form-subtitle">Cole o token recebido por e-mail</p>
      </div>

      <div class="error-banner" *ngIf="errorMessage">⚠ {{ errorMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field" [class.field--error]="token?.invalid && token?.touched">
          <label for="token">Token do convite</label>
          <input id="token" type="text" formControlName="token" placeholder="Cole o token aqui"/>
          <span class="field-error" *ngIf="token?.errors?.['required'] && token?.touched">Token é obrigatório</span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Aceitar convite ↗</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>

      <p class="form-footer">
        Já tem conta? <a routerLink="/login" class="link">Entrar →</a>
      </p>
    }

    @if (success) {
      <div class="state state--success">
        <div class="state-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="state-title">Conta criada!</h2>
        <p class="state-text">Redirecionando para o login...</p>
      </div>
    }
  </div>
</div>
