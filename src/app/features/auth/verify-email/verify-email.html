<div class="verify-wrapper">
  <div class="verify-card">
    <div class="verify-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9 2 6.5 4 6.5 7c0 1.5.5 3 1 4.5C8.5 14 9 16 9 18c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2 0-2 .5-4 1.5-6.5.5-1.5 1-3 1-4.5C17.5 4 15 2 12 2z" fill="#0F6E56"/>
      </svg>
    </div>

    @if (status === 'loading') {
      <div class="state">
        <div class="spinner"></div>
        <p class="state-text">Verificando e-mail...</p>
      </div>
    }

    @if (status === 'success') {
      <div class="state state--success">
        <div class="state-icon state-icon--success">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="state-title">E-mail verificado!</h2>
        <p class="state-text">{{ message }}</p>
        <a routerLink="/login" class="btn-primary">Ir para o login →</a>
      </div>
    }

    @if (status === 'error') {
      <div class="state state--error">
        <div class="state-icon state-icon--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </div>
        <h2 class="state-title">Ops, algo deu errado</h2>
        <p class="state-text">{{ message }}</p>
        <a routerLink="/login" class="btn-secondary">Voltar ao login</a>
      </div>
    }
  </div>
</div>
