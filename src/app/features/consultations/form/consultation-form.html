<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Nova consulta</h1>
      <p class="page-subtitle">Registre o relatório da consulta</p>
    </div>
    <a routerLink="/consultations" class="btn-back">← Voltar</a>
  </div>

  <div class="form-card">
    @if (errorMessage()) {
      <div class="error-banner">⚠ {{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field" [class.field--error]="patientId?.invalid && patientId?.touched">
        <label for="patient_id">Paciente *</label>
        <select id="patient_id" formControlName="patient_id">
          <option value="">Selecione um paciente</option>
          @for (patient of patients(); track patient.id) {
            <option [value]="patient.id">{{ patient.full_name }}</option>
          }
        </select>
        <span class="field-error" *ngIf="patientId?.errors?.['required'] && patientId?.touched">Paciente é obrigatório</span>
      </div>

      <div class="field" [class.field--error]="appointmentId?.invalid && appointmentId?.touched">
        <label for="appointment_id">Agendamento *</label>
        @if (loadingAppointments()) {
          <select disabled>
            <option>Carregando agendamentos...</option>
          </select>
        } @else {
          <select id="appointment_id" formControlName="appointment_id" [disabled]="!patientId?.value">
            <option value="">{{ patientId?.value ? 'Selecione um agendamento' : 'Selecione um paciente primeiro' }}</option>
            @for (appt of appointments(); track appt.id) {
              <option [value]="appt.id">{{ formatDateTime(appt.scheduled_at) }}</option>
            }
          </select>
        }
        <span class="field-error" *ngIf="appointmentId?.errors?.['required'] && appointmentId?.touched">Agendamento é obrigatório</span>
      </div>

      <div class="field">
        <label for="diagnosis">Diagnóstico</label>
        <textarea id="diagnosis" formControlName="diagnosis" placeholder="Descreva o diagnóstico..." rows="4"></textarea>
      </div>

      <div class="field">
        <label for="treatment">Tratamento</label>
        <textarea id="treatment" formControlName="treatment" placeholder="Descreva o tratamento prescrito..." rows="4"></textarea>
      </div>

      <div class="form-actions">
        <a routerLink="/consultations" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">Registrar consulta</span>
          <span *ngIf="isLoading()" class="spinner"></span>
        </button>
      </div>

    </form>
  </div>
</div>
